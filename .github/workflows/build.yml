name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          ls -la
          GW=$(find. -name "gradlew" -type f | head -n 1)
          echo "Found gradlew at: $GW"
          chmod +x "$GW"
          cd "$(dirname "$GW")" &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: driving-test-apk
          path: '**/app-debug.apk'
