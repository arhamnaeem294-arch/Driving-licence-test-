name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --prefix Driving-licence-test- || npm install
      - run: npm run build --prefix Driving-licence-test- || true
      - run: npm i @capacitor/core @capacitor/cli @capacitor/android --prefix Driving-licence-test- || true
      - run: cd Driving-licence-test- && npx cap init DT com.dt.app --web-dir=dist --npm-client=npm || true
      - run: cd Driving-licence-test- && npx cap add android || true
      - run: cd Driving-licence-test- && npx cap copy || true
      - run: find Driving-licence-test- -name gradlew -exec chmod +x {} \;
      - run: cd Driving-licence-test-/android &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: driving-test-apk
          path: '**/app-debug.apk'
