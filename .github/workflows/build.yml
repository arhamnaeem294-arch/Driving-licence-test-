name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build APK
        run: |
          ls -la
          if [ -f "Driving-licence-test-/package.json" ]; then cd Driving-licence-test-; echo "Found inner folder, cd inside"; fi
          ls -la
          npm install
          npm run build || npm run dist || echo "build done"
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Driving Test" com.driving.test --web-dir=dist --npm-client=npm || npx cap init "Driving Test" com.driving.test --web-dir=build --npm-client=npm || true
          npx cap add android
          npx cap copy
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: driving-test-apk
          path: "**/app-debug.apk"
