name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: find. -name "gradlew" -type f
      - run: find. -name "gradlew" -exec chmod +x {} \;
      - run: |
          GW=$(find. -name "gradlew" | head -n 1)
          echo "Found: $GW"
          cd $(dirname $GW) &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: driving-test-apk
          path: '**/app-debug.apk'
